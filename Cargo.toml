[package]
name = "silentmouse"
version = "0.1.0"
edition = "2024"
description = "Post background-capable mouse events to macOS windows"
license = "MIT"
repository = "https://github.com/ph0ryn/silentmouse"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
foreign-types = "0.5.0"
libc = "0.2.178"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSGraphicsContext"] }
objc2-core-foundation = { version = "0.3.2", features = ["objc2"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventTypes"] }
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
